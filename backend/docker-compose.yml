version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: foundry_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgre
      POSTGRES_DB: startup-foundary
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: foundry_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: foundry_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgre@postgres:5432/startup-foundary
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=Rzi2GWsSNEZbUSJywszuh-_5g3FFgeaT96tYqqCC0BI
      - FIREBASE_CREDENTIALS=startup-foundary-firebase-adminsdk-fbsvc-bfee4ca3f8.json
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  ai-scorer-worker:
    build: .
    container_name: foundry_ai_scorer_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgre@postgres:5432/startup-foundary
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: python workers/ai_scorer_worker.py

  notification-worker:
    build: .
    container_name: foundry_notification_worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: python workers/notification_worker.py

  matching-worker:
    build: .
    container_name: foundry_matching_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgre@postgres:5432/startup-foundary
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: python workers/matching_worker.py

  search-indexer-worker:
    build: .
    container_name: foundry_search_indexer_worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: python workers/search_indexer_worker.py

  audit-worker:
    build: .
    container_name: foundry_audit_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgre@postgres:5432/startup-foundary
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: python workers/audit_worker.py